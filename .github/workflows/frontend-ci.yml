name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neural_care_hub_main
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: neural_care_hub_main/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
